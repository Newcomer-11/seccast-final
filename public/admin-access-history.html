<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Lịch sử truy cập</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    body { font-family: 'Rajdhani', monospace; background: #0a0e0c; color: #e0f0e8; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #243529; }
    th { background: #111714; font-weight: 600; color: #00cc6a; }
    tr:hover { background: #161e1a; }
    .btn { padding: 8px 16px; margin-top: 20px; background: #00cc6a; color: #000; border: none; border-radius: 4px; cursor: pointer; font-family: 'Rajdhani'; }
    .btn:hover { opacity: 0.85; }
    .btn-danger { background: #ff3c5a; }
    h1 { color: #00cc6a; margin-bottom: 20px; }
    .pagination { margin-top: 20px; display: flex; gap: 10px; }
    .pagination button { padding: 6px 12px; background: #111714; border: 1px solid #243529; color: #e0f0e8; cursor: pointer; }
    .pagination button:hover { border-color: #00cc6a; }
    .pagination button.active { background: #00cc6a; color: #000; }
    .empty { text-align: center; padding: 40px; color: #4a7060; }
  </style>
</head>
<body>
<div class="container">
  <h1>📋 Lịch sử truy cập</h1>
  
  <div id="content">
    <table id="table">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Địa chỉ</th>
          <th>IP</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5" class="empty">⏳ Đang tải...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

  <button class="btn btn-danger" onclick="clearHistory()">Xóa toàn bộ lịch sử</button>
  <button class="btn" onclick="window.history.back()">← Quay lại</button>
</div>

<script>
const PAGE_SIZE = 50;
let currentPage = 1;

async function loadHistory(page = 1) {
  try {
    const res = await fetch(`/admin/api/access-history?page=${page}&limit=${PAGE_SIZE}`);
    if (res.status === 401) { alert('Hết phiên đăng nhập'); window.location = '/admin/login'; return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    
    const { history, total } = await res.json();
    renderTable(history, total, page);
    currentPage = page;
  } catch (e) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="5" class="empty">❌ Lỗi: ${e.message}</td></tr>`;
  }
}

function renderTable(history, total, page) {
  const tbody = document.getElementById('tbody');
  if (!history.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Chưa có lịch sử truy cập</td></tr>';
  } else {
    tbody.innerHTML = history.map((h, i) => {
      const date = new Date(h.submitted_at).toLocaleString('vi-VN');
      return `<tr>
        <td>${(page - 1) * PAGE_SIZE + i + 1}</td>
        <td>${escapeHtml(h.full_name)}</td>
        <td>${escapeHtml(h.address)}</td>
        <td><code>${h.ip}</code></td>
        <td>${date}</td>
      </tr>`;
    }).join('');
  }

  // Pagination
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const pagination = document.getElementById('pagination');
  let html = '';
  for (let p = 1; p <= totalPages; p++) {
    const active = p === page ? 'active' : '';
    html += `<button class="${active}" onclick="loadHistory(${p})">${p}</button>`;
  }
  pagination.innerHTML = html;
}

async function clearHistory() {
  if (!confirm('Xác nhận xóa toàn bộ lịch sử truy cập?')) return;
  try {
    const res = await fetch('/admin/api/access-history', { method: 'DELETE' });
    if (!res.ok) throw new Error('Xóa thất bại');
    alert('Đã xóa lịch sử');
    loadHistory(1);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadHistory(1);
</script>
</body>
</html>
